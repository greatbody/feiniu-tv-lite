apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'ink.sunrui.feiniutv'
    compileSdk 34

    defaultConfig {
        applicationId "ink.sunrui.feiniutv"
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        pickFirst 'lib/*/libijkffmpeg.so'
        pickFirst 'lib/*/libijkplayer.so'
        pickFirst 'lib/*/libijksdl.so'
    }

    buildFeatures {
        viewBinding true
    }
}

// 强制所有配置使用 OkHttp 3.12.13（API 19 兼容的最后版本）
// Retrofit 2.9.0 传递依赖 OkHttp 3.14.9（需 API 21），必须强制降级
configurations.all {
    resolutionStrategy {
        force 'com.squareup.okhttp3:okhttp:3.12.13'
        force 'com.squareup.okhttp3:logging-interceptor:3.12.13'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Architecture Components (MVVM)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'

    // AndroidX Leanback (for TV focus & GridViews)
    implementation 'androidx.leanback:leanback:1.0.0'

    // Network (Retrofit + OkHttp, API 19 compatible)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.12.13'

    // Image Loading (Glide)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Video Player (IjkPlayer)
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-armv7a:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-x86:0.8.8'

    // ===== QR 登录（自包含小型 HTTP 服务）=====
    // NanoHTTPD 2.3.1：单 jar 50KB，Java 6+，API 19 兼容；用于 LoginActivity 内嵌的密码收集服务
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // ZXing core 3.3.3：最后支持 Java 7 的纯 Java 版本，用于生成 QR Bitmap
    implementation 'com.google.zxing:core:3.3.3'
}
